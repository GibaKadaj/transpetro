<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0a3c;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#4318a8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#5b21b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Transpetro Text -->
  <text x="256" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">TRANSPETRO</text>

  <!-- Prep Text -->
  <text x="256" y="350" font-family="Arial, sans-serif" font-size="48" font-weight="600" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle">PREP</text>

  <!-- Decorative dots -->
  <circle cx="180" cy="200" r="6" fill="#06b6d4" opacity="0.6"/>
  <circle cx="332" cy="200" r="6" fill="#06b6d4" opacity="0.6"/>
  <circle cx="256" cy="180" r="8" fill="#a78bfa" opacity="0.8"/>
</svg>